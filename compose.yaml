services:
  qwixx:
    build: .
    image: qwixx-ai:distributed
    container_name: qwixx-ai
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      TZ: America/Costa_Rica
      QWIXX_DATA: /app/runs
      QWIXX_TORCH_THREADS: "2"
      QWIXX_CENTRAL_WORKERS: "2"
      QWIXX_MAX_BROWSER_WORKERS: "2"
      PYTHONUNBUFFERED: "1"
      QWIXX_SMTP_HOST: ${QWIXX_SMTP_HOST:-}
      QWIXX_SMTP_PORT: ${QWIXX_SMTP_PORT:-}
      QWIXX_SMTP_USER: ${QWIXX_SMTP_USER:-}
      QWIXX_SMTP_PASSWORD: ${QWIXX_SMTP_PASSWORD:-}
      QWIXX_SMTP_FROM: ${QWIXX_SMTP_FROM:-}
      QWIXX_SMTP_SSL: ${QWIXX_SMTP_SSL:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      GMAIL_ID: ${GMAIL_ID:-}
      GMAIL_TOKEN: ${GMAIL_TOKEN:-}
      QWIXX_COOKIE_SECURE: ${QWIXX_COOKIE_SECURE:-false}
    volumes:
      - ./runs:/app/runs
    command: ["python", "-m", "qwixx_ai.distributed", "--host", "0.0.0.0", "--port", "8765"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 2g
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
