[build-system]
requires=['setuptools>=84.2.1']
build-backend='setuptools.build_meta'
[project]
name='qwixx-ai'
version='0.0.0'
requires-python='>=3.10'
dependencies=['numpy>=2.2.6','torch>=2.14.1']
[project.optional-dependencies]
gym=['gymnasium>=1.4.0']
dev=['pytest>=9.2.0','pytest-cov>=6.0.0','gymnasium>=1.4.0','ruff>=0.17.4']

[tool.setuptools.packages.find]
include = ['qwixx_ai*']
exclude = ['tests*', 'runs*']

[tool.ruff]
target-version='py310'
line-length=100

[tool.ruff.lint]
select=['F']
ignore=[]


# Coverage is intentionally scoped to deployed/runtime code. Historical
# experiment, audit, benchmark, and offline training scripts remain available
# for reproducibility but do not define production coverage quality.
[tool.coverage.run]
branch = true
source = ["qwixx_ai"]
omit = [
  "qwixx_ai/phase*.py",
  "qwixx_ai/*_benchmark.py",
  "qwixx_ai/*_audit.py",
  "qwixx_ai/*_experiment.py",
  "qwixx_ai/controlled_strategy.py",
  "qwixx_ai/decision_quality.py",
  "qwixx_ai/decision_quality_heldout.py",
  "qwixx_ai/league.py",
  "qwixx_ai/position_value.py",
  "qwixx_ai/rollout_agent.py",
  "qwixx_ai/row_change_experiment.py",
  "qwixx_ai/search_*.py",
  "qwixx_ai/strategy_tournament.py",
  "qwixx_ai/train.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Process-entrypoint wrappers are validated by Docker/browser integration jobs.
# The runtime coverage metric focuses on reusable production logic.
exclude_also = [
  "def main\\(",
  "def serve\\(",
  "if __name__ == ['\"]__main__['\"]:",
]
