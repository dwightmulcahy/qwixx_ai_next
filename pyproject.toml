[build-system]
requires=['setuptools>=68']
build-backend='setuptools.build_meta'
[project]
name='qwixx-ai'
version='0.0.0'
requires-python='>=3.10'
dependencies=['numpy>=1.24','torch>=2.1']
[project.optional-dependencies]
gym=['gymnasium>=0.29']
dev=['pytest>=8','gymnasium>=0.29','ruff>=0.14']

[tool.ruff]
target-version='py310'
line-length=100

[tool.ruff.lint]
select=['F']
ignore=[]
