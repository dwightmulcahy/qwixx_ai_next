name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Shared Python lint
    uses: dwightmulcahy/repo-template/.github/workflows/reusable-python-ci.yml@d89e9db45ba77fd32d95da02620476eada9c01cd
    with:
      python-version: '3.14'
      install-command: python -m pip install -e '.[dev]'
      lint-command: python -m ruff check --select F qwixx_ai tests scripts
      test-command: python -m compileall -q qwixx_ai tests scripts

  training:
    name: Training and recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_distributed.py -k "replay or priority or central_rollout or training_database or training_pause or policy_export or independent_sessions" --junitxml=training.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: training-results
          path: training.xml
          if-no-files-found: ignore
  browser:
    name: Browser and HTTP integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_distributed.py -k "browser or difficulty or admin or worker_rate" --junitxml=browser.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-results
          path: browser.xml
          if-no-files-found: ignore
  full-suite:
    name: Full regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q qwixx_ai tests
      - run: python -m pytest -q --junitxml=all-tests.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: full-suite-results
          path: all-tests.xml
          if-no-files-found: ignore
  compose:
    name: Validate Compose configurations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate local and QNAP configurations
        env:
          IMAGE: example/qwixx-ai:1.0.0
          QNAP_DATA_DIR: /tmp/qwixx-runs
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.qnap.yaml config --quiet
  docker:
    name: Docker API integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: qwixx-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run and verify container APIs (inference-only)
        run: |
          set -euo pipefail
          docker run -d --name qwixx-ci -p 127.0.0.1:8765:8765 --read-only --tmpfs /tmp:rw,nosuid,nodev,size=128m --mount type=tmpfs,destination=/app/runs,tmpfs-mode=1777 --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 256 --memory 2g -e QWIXX_DATA=/app/runs -e QWIXX_INFERENCE_ONLY=true -e QWIXX_TRAINING_ENABLED=false -e QWIXX_BROWSER_TRAINING_ENABLED=false -e QWIXX_CENTRAL_WORKERS=0 qwixx-ai:ci
          trap 'docker logs qwixx-ci || true; docker rm -f qwixx-ci || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:8765/health >/tmp/health.json; then break; fi
            sleep 3
          done
          python - <<'PY'
          import json
          from pathlib import Path
          health=json.loads(Path('/tmp/health.json').read_text())
          assert health['healthy'] is True
          PY
          curl --fail --silent http://127.0.0.1:8765/api/stats >/tmp/stats.json
          python - <<'PY'
          import json
          from pathlib import Path
          stats=json.loads(Path('/tmp/stats.json').read_text())
          for key in ('games','updates','replay_size','model_version','database_games'):
              assert key in stats, key
          assert stats['training_enabled'] is False
          assert stats['browser_training_enabled'] is False
          assert stats['inference_only'] is True
          assert stats['paused'] is True
          PY
          curl --fail --silent -X POST http://127.0.0.1:8765/reset \
            -H 'Content-Type: application/json' \
            -d '{"difficulty":"intermediate"}' >/tmp/session.json
          python - <<'PY'
          import json
          from pathlib import Path
          session=json.loads(Path('/tmp/session.json').read_text())
          assert session['session_id']
          assert session['difficulty']=='intermediate'
          assert 'legal' in session and 'scores' in session
          PY
  chromium-smoke:
    name: Chromium browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]' playwright
      - run: python -m playwright install --with-deps chromium
      - name: Launch app and exercise browser
        run: python scripts/chromium_smoke.py
  required:
    name: CI gate
    if: always()
    needs: [lint, training, browser, full-suite, compose, docker, chromium-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do test "$result" = success || exit 1; done
          test "$(wc -w <<< "$RESULTS")" -eq 7
