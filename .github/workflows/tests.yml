name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Ruff lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check qwixx_ai tests
      - run: ruff format --check qwixx_ai tests
  rules:
    name: Rules / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_rules.py --junitxml=rules.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rules-py${{ matrix.python-version }}
          path: rules.xml
          if-no-files-found: ignore
  training:
    name: Training and recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_distributed.py -k "replay or priority or central_rollout or training_database or training_pause or policy_export or independent_sessions" --junitxml=training.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-results
          path: training.xml
          if-no-files-found: ignore
  browser:
    name: Browser and HTTP integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_distributed.py -k "browser or difficulty or admin or worker_rate" --junitxml=browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: browser.xml
          if-no-files-found: ignore
  full-suite:
    name: Full regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q qwixx_ai tests
      - run: python -m pytest -q --junitxml=all-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-suite-results
          path: all-tests.xml
          if-no-files-found: ignore
  docker:
    name: Docker build and health smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: qwixx-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run and verify container health
        run: |
          set -euo pipefail
          docker run -d --name qwixx-ci -p 127.0.0.1:8765:8765 -e QWIXX_DATA=/app/runs qwixx-ai:ci
          trap 'docker logs qwixx-ci || true; docker rm -f qwixx-ci || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:8765/health; then exit 0; fi
            sleep 3
          done
          exit 1
  required:
    name: CI gate
    if: always()
    needs: [lint, rules, training, browser, full-suite, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do test "$result" = success || exit 1; done
          test "$(wc -w <<< "$RESULTS")" -eq 6
