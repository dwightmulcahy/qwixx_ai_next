name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Ruff / Pyflakes correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff lint (including Pyflakes F rules)
        run: python -m ruff check --select F qwixx_ai tests scripts
  rules:
    name: Rules / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_rules.py --junitxml=rules.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rules-py${{ matrix.python-version }}
          path: rules.xml
          if-no-files-found: ignore
  training:
    name: Training and recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_distributed.py -k "replay or priority or central_rollout or training_database or training_pause or policy_export or independent_sessions" --junitxml=training.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: training-results
          path: training.xml
          if-no-files-found: ignore
  browser:
    name: Browser and HTTP integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_distributed.py -k "browser or difficulty or admin or worker_rate" --junitxml=browser.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: browser.xml
          if-no-files-found: ignore
  full-suite:
    name: Full regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q qwixx_ai tests
      - run: python -m pytest -q --junitxml=all-tests.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-suite-results
          path: all-tests.xml
          if-no-files-found: ignore
  docker:
    name: Docker API integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: qwixx-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run and verify container APIs
        run: |
          set -euo pipefail
          docker run -d --name qwixx-ci -p 127.0.0.1:8765:8765 -e QWIXX_DATA=/app/runs qwixx-ai:ci
          trap 'docker logs qwixx-ci || true; docker rm -f qwixx-ci || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:8765/health >/tmp/health.json; then break; fi
            sleep 3
          done
          python - <<'PY'
          import json
          from pathlib import Path
          health=json.loads(Path('/tmp/health.json').read_text())
          assert health['healthy'] is True
          PY
          curl --fail --silent http://127.0.0.1:8765/api/stats >/tmp/stats.json
          python - <<'PY'
          import json
          from pathlib import Path
          stats=json.loads(Path('/tmp/stats.json').read_text())
          for key in ('games','updates','replay_size','model_version','database_games'):
              assert key in stats, key
          PY
          curl --fail --silent -X POST http://127.0.0.1:8765/reset \
            -H 'Content-Type: application/json' \
            -d '{"difficulty":"intermediate"}' >/tmp/session.json
          python - <<'PY'
          import json
          from pathlib import Path
          session=json.loads(Path('/tmp/session.json').read_text())
          assert session['session_id']
          assert session['difficulty']=='intermediate'
          assert 'legal' in session and 'scores' in session
          PY
  required:
    name: CI gate
    if: always()
    needs: [lint, rules, training, browser, full-suite, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do test "$result" = success || exit 1; done
          test "$(wc -w <<< "$RESULTS")" -eq 6
