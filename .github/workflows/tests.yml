name: Qwixx staged validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rules:
    name: "Stage 1 - rules"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_rules.py
  recovery:
    name: "Stage 2 - training and recovery"
    needs: rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_distributed.py -k "replay or priority or central_rollout or training_database or training_pause or policy_export or independent_sessions"
  browser_docker:
    name: "Stage 3 - browser and Docker"
    needs: recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_distributed.py -k "browser or difficulty or admin or worker_rate"
      - run: python -m compileall -q qwixx_ai tests
      - run: docker build -t qwixx-ai:validation .
      - run: docker run --rm --entrypoint python qwixx-ai:validation -c "from qwixx_ai.core import Game; from qwixx_ai.distributed import Coordinator; print(Game(seed=1).scores())"
