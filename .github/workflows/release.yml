name: Release Docker image
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing version tag (v1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Full validation for tagged release
    uses: ./.github/workflows/tests.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Resolve existing tag
        id: version
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected stable existing tag vMAJOR.MINOR.PATCH'; exit 1; }
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          numeric="${VERSION#v}"
          echo "major=${numeric%%.*}" >> "$GITHUB_OUTPUT"
          remainder="${numeric#*.}"
          echo "minor=${remainder%%.*}" >> "$GITHUB_OUTPUT"
          echo "patch=${remainder#*.}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag is on main
        id: verify
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          SHA=$(git rev-parse "refs/tags/$VERSION^{commit}")
          git merge-base --is-ancestor "$SHA" origin/main
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Determine version-line Docker aliases
        id: latest
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          versions="$(git tag --list 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')"
          current="${VERSION#v}"
          major="${current%%.*}"
          minor="${current%.*}"
          newest="$(printf '%s\n' "$versions" | sort -V | tail -n 1)"
          newest_major="$(printf '%s\n' "$versions" | awk -F. -v m="$major" '$1==m' | sort -V | tail -n 1)"
          newest_minor="$(printf '%s\n' "$versions" | awk -F. -v m="$major" -v n="${minor#*.}" '$1==m && $2==n' | sort -V | tail -n 1)"
          echo "publish_latest=$([[ "$current" == "$newest" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "publish_major=$([[ "$current" == "$newest_major" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "publish_minor=$([[ "$current" == "$newest_minor" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail
          conclusion=$(gh api "/repos/$REPO/actions/runs?head_sha=$SHA&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.name=="CI") | .conclusion][0] // "missing"')
          echo "CI workflow for $SHA: $conclusion"
          if [ "$conclusion" = success ]; then
            exit 0
          fi

          check_conclusion=$(gh api "/repos/$REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name=="CI gate") | .conclusion][0] // "missing"')
          echo "CI gate check for $SHA: $check_conclusion"
          test "$check_conclusion" = success

      - name: Generate grouped conventional-commit changelog
        uses: dwightmulcahy/repo-template/.github/actions/release-notes@f3dc1af2146156866574485a20ded5ac35d08a88
        with:
          tag: ${{ steps.version.outputs.tag }}
          project-name: Qwixx AI
          image: dwightmulcahy/qwixx-ai
          output: release-notes.md

      - name: Create or update GitHub Release with grouped changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION" --notes-file release-notes.md
          else
            gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file release-notes.md
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and load amd64 smoke-test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: qwixx-ai:release-check
          build-args: |
            QWIXX_GIT_VERSION=${{ steps.version.outputs.tag }}

      - name: Container smoke test
        run: |
          set -euo pipefail
          docker run -d --name qwixx-release -p 127.0.0.1:8765:8765 qwixx-ai:release-check
          trap 'docker logs qwixx-release || true; docker rm -f qwixx-release || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:8765/health; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish versioned Docker Hub image
        uses: dwightmulcahy/repo-template/.github/actions/docker-publish@5d53ef5f4bc64a296c057d6c64ec10e7a0245c39
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/qwixx-ai:${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}.${{ steps.version.outputs.patch }}
            ${{ steps.latest.outputs.publish_major == 'true' && format('{0}/qwixx-ai:{1}', secrets.DOCKERHUB_USERNAME, steps.version.outputs.major) || '' }}
            ${{ steps.latest.outputs.publish_minor == 'true' && format('{0}/qwixx-ai:{1}.{2}', secrets.DOCKERHUB_USERNAME, steps.version.outputs.major, steps.version.outputs.minor) || '' }}
            ${{ steps.latest.outputs.publish_latest == 'true' && format('{0}/qwixx-ai:latest', secrets.DOCKERHUB_USERNAME) || '' }}
          build-args: QWIXX_GIT_VERSION=${{ steps.version.outputs.tag }}
          provenance: mode=max
          sbom: true

